version: 2

project_name: ghostci

builds:
  - main: ./cmd/ghostci
    env:
      - CGO_ENABLED=0
    # Windows is not built for release: it compiles, but refuses to run until
    # process-group cancellation is implemented there, and shipping a binary
    # that cannot work is worse than shipping none.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/aliramazanov/ghostci/internal/version.version={{.Version}}
      - -X github.com/aliramazanov/ghostci/internal/version.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  draft: true
