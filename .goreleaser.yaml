version: 2

project_name: ghostci

builds:
  - main: ./cmd/ghostci
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/aliramazanov/ghostci/internal/version.version={{.Version}}
      - -X github.com/aliramazanov/ghostci/internal/version.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  draft: true
