name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Lint (golangci/golangci-lint-action v9.3.0)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12
      - name: Test
        run: go test -race ./...
      - name: Fuzz
        run: |
          go test ./internal/pipeline/ -run xxx -fuzz FuzzTrimStaysValidText -fuzztime 30s
          go test ./internal/importer/ -run xxx -fuzz FuzzSlugMakesAUsableName -fuzztime 30s
          go test ./internal/expr/ -run xxx -fuzz FuzzInterpolate -fuzztime 30s
          go test ./internal/config/ -run xxx -fuzz FuzzParse -fuzztime 30s
      - name: Cross compile
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./...

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"
      - name: Test
        run: go test -race ./...

  windows-builds:
    runs-on: windows-latest
    steps:
      - name: Checkout (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Refuses to run rather than hanging
        run: |
          go build -o ghostci.exe ./cmd/ghostci
          ./ghostci.exe version
