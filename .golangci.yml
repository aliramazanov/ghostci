version: "2"

linters:
  enable:
    - gocognit
    - prealloc
    - errorlint
    - nilerr
    - nilnil
    - unconvert
    - misspell
    - durationcheck
    - copyloopvar
    - wastedassign
  settings:
    gocognit:
      min-complexity: 30
  exclusions:
    rules:
      - source: "fmt\\.Fprint"
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - prealloc
          - errorlint
      - path: (internal/hook/hook\.go|internal/git/repo\.go|internal/importer/azure\.go)
        linters:
          - nilerr
